# fly.toml app configuration file generated for fluxoid on 2026-09-04T14:48:06-07:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'fluxoid'
primary_region = 'lax'

[build]
  dockerfile = 'Dockerfile'

[env]
  CORS_ORIGIN = 'https://fluxoid.fly.dev'
  DATA_DIR = '/app/server/data'
  NODE_ENV = 'production'
  PORT = '8080'
  STATIC_DIR = '/app/client/dist'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
  cpus = 1
  memory_mb = 512
